# URL do banco de dados, usu\u00e1rio e senha
spring.datasource.url=jdbc:postgresql://localhost:5432/nexsite_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Cria ou atualiza as tabelas automaticamente baseado no seu c\u00f3digo Java
spring.jpa.hibernate.ddl-auto=update

# Mostra as instru\u00e7\u00f5es SQL no console (\u00fatil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect