<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filtrar — NexSite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161F; --paper:#F1F2F6; --surface:#FFFFFF;
    --cobalt:#1F3A8F; --cobalt-dark:#152A6B;
    --beacon:#F2A93B; --beacon-dark:#D98F1F;
    --muted:#5B5F6B; --line:#DEE1E8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--surface);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  a{color:inherit;text-decoration:none;}

  .phone{max-width:420px;margin:0 auto;min-height:100vh;background:var(--surface);display:flex;flex-direction:column;}

  .top-bar{
    display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:10;
  }
  .top-bar .close{font-size:22px;color:var(--muted);width:30px;}
  .top-bar h1{font-size:17px;font-weight:600;font-family:'Inter',sans-serif;}
  .top-bar .reset{font-size:13.5px;font-weight:600;color:var(--cobalt);}

  .content{flex:1;padding:20px;overflow-y:auto;}
  .filter-group{margin-bottom:28px;}
  .filter-group h4{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:14px;}

  .chip-select{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-option{
    color:var(--ink);font-size:14px;padding:9px 16px;border-radius:20px;border:1.5px solid var(--line);font-size:14px;font-weight:500;
    transition:all .12s;
  }
  .chip-option.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .filter-group select{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;
    outline:none;background:var(--surface);color:var(--ink);margin-bottom:10px;
  }
  .filter-group select:last-child{margin-bottom:0;}
  .filter-group select:focus{border-color:var(--cobalt);}
  .filter-group select:disabled{background:var(--paper);color:var(--muted);cursor:not-allowed;}
  .filter-error{font-size:13px;color:#B42318;margin-top:8px;}
  [hidden]{display:none !important;}
  .filtro-dica{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45;}
  .radio-dica{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:400;}
  .filter-group input[type=text]{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;
    font-family:inherit;outline:none;
  }
  .filter-group input[type=text]:focus{border-color:var(--cobalt);}
  .price-row input{width:100%;min-width:0;padding:13px 14px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;outline:none;}
  .price-row input:focus{border-color:var(--cobalt);}

  .radio-list{display:flex;flex-direction:column;gap:2px;}
  .radio-row{
    cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 2px;
    border-bottom:1px solid var(--line);font-size:15px;
  }
  .radio-row:last-child{border-bottom:none;}
  .radio-circle{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);position:relative;flex-shrink:0;}
  .radio-row.selected .radio-circle{border-color:var(--cobalt);}
  .radio-row.selected .radio-circle::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--cobalt);}

  .price-row{display:flex;align-items:center;gap:10px;}
  .price-row input{flex:1;}
  .price-row span{color:var(--muted);font-size:14px;}

  .bottom-bar{
    padding:16px 20px 22px;border-top:1px solid var(--line);display:flex;gap:12px;
    position:sticky;bottom:0;background:var(--surface);
  }
  .btn{flex:1;padding:15px;border-radius:9px;font-weight:600;font-size:15px;text-align:center;}
  .btn-outline{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);}
  .btn-primary{background:var(--cobalt);color:#fff;}
</style>
</head>
<body>

<div class="phone">

  <div class="top-bar">
    <a class="close" id="btnFechar" href="busca.html" aria-label="Fechar">✕</a>
    <h1>Filtrar</h1>
    <button class="reset" id="btnLimpar" type="button">Limpar</button>
  </div>

  <div class="content">

    <div class="filter-group">
      <h4>Categoria</h4>
      <div class="chip-select" id="chipsCategorias"></div>
    </div>

    <div class="filter-group">
      <h4>Tipo</h4>
      <div class="chip-select" id="chipsTipos"></div>
    </div>

    <div class="filter-group">
      <h4>Avaliação</h4>
      <div class="chip-select" id="chipsNota"></div>
      <p class="filtro-dica" id="dicaNota" hidden>Empresas ainda sem avaliações ficam de fora.</p>
    </div>

    <div class="filter-group">
      <h4>Localização</h4>
      <select id="filtroEstado"><option value="">Todos os estados</option></select>
      <select id="filtroCidade" disabled><option value="">Todas as cidades</option></select>
      <input type="text" id="filtroCidadeTexto" placeholder="Digite a cidade" maxlength="100" hidden>
    </div>

    <div class="filter-group">
      <h4>Faixa de preço</h4>
      <div class="price-row">
        <input type="number" id="filtroPrecoMin" min="0" step="0.01" placeholder="R$ mín." inputmode="decimal">
        <span>—</span>
        <input type="number" id="filtroPrecoMax" min="0" step="0.01" placeholder="R$ máx." inputmode="decimal">
      </div>
      <p class="filter-error" id="erroPreco" hidden>O mínimo não pode ser maior que o máximo.</p>
    </div>

    <div class="filter-group">
      <h4>Ordenar por</h4>
      <div class="radio-list" id="listaOrdem">
        <div class="radio-row selected" data-valor="recentes"><span>Mais recentes</span><span class="radio-circle"></span></div>
        <div class="radio-row" data-valor="melhores"><span>Mais bem avaliadas<small class="radio-dica">Considera a nota e a quantidade de avaliações</small></span><span class="radio-circle"></span></div>
        <div class="radio-row" data-valor="nome"><span>Nome (A–Z)</span><span class="radio-circle"></span></div>
        <div class="radio-row" data-valor="preco"><span>Menor preço</span><span class="radio-circle"></span></div>
      </div>
    </div>

  </div>

  <div class="bottom-bar">
    <a class="btn btn-outline" id="btnCancelar" href="busca.html">Cancelar</a>
    <a class="btn btn-primary" id="btnVer" href="busca.html">Ver empresas</a>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
